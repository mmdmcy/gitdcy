[workspace]
members = [
  "crates/gitdcy-core",
  "crates/gitdcy-cli",
  "crates/gitdcy-gui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.1", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
libc = "0.2.186"
eframe = "0.34.3"
egui = "0.34.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
sha2 = "0.10.9"
toml = "1.1.3"
