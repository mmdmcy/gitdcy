[workspace]
members = [
  "crates/gitdcy-core",
  "crates/gitdcy-cli",
]
# The GUI is its own workspace with its own Cargo.lock, so this lock (what the
# CLI is built and installed from) lists only the CLI's crates.
exclude = ["crates/gitdcy-gui"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.1", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = "1.1.3"
