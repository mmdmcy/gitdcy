schema_version = "linuxmice.component.v1"
id = "katteke.gitdcy"
display_name = "GitDCY"
version = "0.1.0"
summary = "Standalone Git lifecycle tool exposed to LinuxMice through a read-only status contract, repository rules and checkouts."
component_type = "integration"
standalone = true
platforms = ["linux", "macos", "windows"]
documentation = "https://docs.katteke.com/products/gitdcy/"

[installation]
package = "gitdcy"

[capabilities]
provides = ["git.status.read", "git.rules.read", "git.rules.check", "git.checkouts.read", "git.checkouts.update", "git.checkouts.facts"]
requires = []
optional = ["hub.catalog"]

[interfaces]
mode = "command"
commands = [
  "/usr/bin/gitdcy status --format json",
  "/usr/bin/gitdcy rules --format json",
  "/usr/bin/gitdcy rules check --format json",
  "/usr/bin/gitdcy checkouts --format json",
  "/usr/bin/gitdcy checkouts --no-fetch --facts --format json",
  "/usr/bin/gitdcy checkouts update --format json",
]
endpoints = []

[authentication]
required = []
optional = []
provides = []

[data]
ownership = "GitDCY reads repository metadata; each repository owner retains data ownership."
backup_responsibility = "Repository owners back up repositories; GitDCY owns no shared database."

[health]
kind = "command"
read_only = true
timeout_ms = 3000

[health.command]
executable = "/usr/bin/gitdcy"
args = ["--help"]
