# Optional source-checkout local config.
#
# GitDCY normally reads machine-local settings from the app config directory as
# local.yaml. When running from this source checkout, it also reads a copied
# .gitdcy.local.yaml file. The copied file is ignored by Git.

# workspace_root: ~/Code

# Fail closed for GitDCY writes when identity profiles are present. GitDCY
# never changes a repository's Git identity automatically; it only detects and
# blocks a mismatch before commit, push, sync, or clone.
# require_identity: true

# Each non-empty selector group on a profile is required to match. Use narrow
# path and remote selectors for private workspaces; a provider-only profile is
# useful for all repositories on one self-hosted Forgejo instance.
# identity_profiles:
#   github-main:
#     name: YOUR_GITHUB_NAME
#     email: YOUR_GITHUB_NOREPLY_EMAIL
#     path_prefixes:
#       - ~/Documents/your-private-workspace/project-a
#     remote_patterns:
#       - github.com/your-account/project-a
#   github-special:
#     name: YOUR_SPECIAL_GITHUB_NAME
#     email: YOUR_SPECIAL_GITHUB_EMAIL
#     path_prefixes:
#       - ~/Documents/your-private-workspace/special-projects
#     remote_patterns:
#       - github-special
#   forgejo-selfhosted:
#     name: YOUR_FORGEJO_NAME
#     email: YOUR_FORGEJO_EMAIL
#     providers:
#       - forgejo

# Optional local CI-style checks. GitDCY runs only explicitly configured
# programs from the repository root; it does not execute GitHub Actions files.
# A matching profile runs before `gitdcy push` unless run_before_push is false.
# Push checks require a clean worktree by default so they test the commit being
# pushed. Manual `gitdcy check` runs against the current worktree.
# require_checks: false
# check_profiles:
#   rust-project:
#     path_prefixes:
#       - ~/Documents/your-workspace/project-a
#     remote_patterns:
#       - github.com/your-account/project-a
#     run_before_push: true
#     require_clean_worktree: true
#     checks:
#       - name: format
#         program: cargo
#         args: [fmt, --all, --check]
#       - name: clippy
#         program: cargo
#         args: [clippy, --all-targets, --all-features, --, -D, warnings]
#         timeout_seconds: 900
#       - name: tests
#         program: cargo
#         args: [test]

# Extra roots to scan when no saved manifest exists.
# scan_roots:
#   - ~/Code
#   - ~/Documents/github
#   - ~/Documents/forgejo
#   - ~/Documents/gitlab

# Optional template used by the GUI when suggesting a private sync remote.
# Supported placeholders: {repo}, {id}
# sync_remote_template: "ssh://git@example.internal/owner/{repo}.git"

# Optional provider defaults used to suggest origin remotes for repos discovered
# under provider folders such as ~/Code/github/my-repo.
# Supported placeholders: {repo}, {id}, {provider}
# origin_remote_templates:
#   github: "https://github.com/YOUR_GITHUB_USERNAME/{repo}.git"
#   gitlab: "git@gitlab.com:YOUR_GITLAB_USERNAME/{repo}.git"
#   forgejo: "ssh://git@forgejo.example/YOUR_FORGEJO_USERNAME/{repo}.git"

# Optional private WIP file allowlist. These exact relative file paths can be
# included in private WIP sync even when ignored by Git. Keep this repo-specific
# for sensitive files such as .env.
# local_sync_files:
#   github/my-app:
#     - .env
#     - .env.local

# Optional per-repo WIP device approvals. The GUI writes this when you press
# "Trust Incoming Device".
# trusted_wip_devices:
#   "*":
#     - laptop-name
#   github/my-app:
#     - laptop-name

# Optional visibility policy. Local-only repos and private Forgejo-style remotes
# are private by default. A remote named "public" is always public-targeted.
# visibility_overrides:
#   github/private-app: private
#   gitlab/public-export: public

# Optional remote URL fragments that should be treated as private remotes.
# private_remote_patterns:
#   - forgejo-easy
#   - git.internal

# Optional remote names that should be treated as public export targets.
# public_export_remotes:
#   - public

# Optional ignore profile additions. "*" applies to every repo; provider names,
# repo ids, and repo folder names are also supported.
# ignore_profiles:
#   "*":
#     - .idea/
#   github/my-app:
#     - local-output/
